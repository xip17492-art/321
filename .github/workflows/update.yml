name: Daily Taiwan Stock Radar v3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    - cron: "10 10 * * 1-5"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --disable-warning=DEP0040
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: advice.defaultBranchName
      GIT_CONFIG_VALUE_0: "false"
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update Taiwan stock radar v3.2-F
        run: python scripts/update_data.py

      - name: Generate offline bootstrap data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("data/data.json").read_text(encoding="utf-8"))
          assert isinstance(payload.get("stocks"), list) and payload["stocks"], "No stock data for offline bootstrap"
          Path("data/bootstrap.js").write_text("window.RADAR_BOOTSTRAP = "+json.dumps(payload,ensure_ascii=False,separators=(",",":"))+";\\n",encoding="utf-8")
          print("BOOTSTRAP OK:",len(payload["stocks"]),"stocks")
          PY

      - name: Validate generated radar data
        run: |
          python -m py_compile scripts/update_data.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/data.json").read_text())
          required=["code","name","score"]
          stocks=d.get("stocks", d if isinstance(d,list) else [])
          assert isinstance(stocks,list) and stocks, "data.json has no stock records"
          missing=[k for k in required if k not in stocks[0]]
          assert not missing, f"missing required fields: {missing}"
          factor_fields=["momentum_5d","momentum_20d","momentum_60d","volatility_20d","high_52w_distance","relative_strength_20d","avg_turnover_20d","research_factor_score"]
          present=sum(1 for k in factor_fields if k in stocks[0])
          assert present >= 6, f"new factor fields incomplete: {present}/{len(factor_fields)}"
          print(f"VALIDATION OK: {len(stocks)} stocks; factor fields {present}/{len(factor_fields)}")
          PY

      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.current = [] if not attrs.get("src") else None
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      if self.current is not None:
                          self.scripts.append("".join(self.current))
                      self.current = None
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          inline = [s for s in parser.scripts if s.strip()]
          assert inline, "No inline scripts found"
          for i, script in enumerate(inline, 1):
              Path(f"/tmp/radar-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Checking {len(inline)} inline scripts with node --check")
          PY
          for f in /tmp/radar-inline-*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/recommendation_history.json data/analyst_tracker.json
          git diff --cached --quiet || git commit -m "chore: update Taiwan stock radar v3.2-F data"
          git pull --rebase origin main
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
